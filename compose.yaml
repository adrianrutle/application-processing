services:
  app:
    build: .
    environment:
      CODESPACES: ${CODESPACES:-false}
      LLM_PROVIDER: lmstudio
      LM_STUDIO_BASE_URL: http://host.docker.internal:1234/v1
      LM_STUDIO_MODEL: ${LM_STUDIO_MODEL:-}
      LM_STUDIO_API_KEY: ${LM_STUDIO_API_KEY:-}
    ports:
      - "127.0.0.1:8000:8000"